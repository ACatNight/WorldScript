# Open-world RPG region template.
# Use the hub as a parent area and keep the branches independently visitable.
# Replace external plugin commands with commands supported by that plugin.
# No level or reputation gates are used in this starter template.

# starter_valley.yml
id: starter_valley
display-name: "Starter Valley"
world-name: world
world-id: world
min: {x: 0, y: 50, z: 0}
max: {x: 160, y: 110, z: 160}
events:
  enter:
    enabled: true
    first-entry-only: true
    actions:
      - type: message
        value: "&aStarter Valley is open. Choose a direction to explore."

# forest.yml
id: forest
display-name: "Whispering Forest"
parent-id: starter_valley
world-name: world
world-id: world
min: {x: 10, y: 50, z: 10}
max: {x: 70, y: 100, z: 70}
events:
  enter:
    enabled: true
    override-parent: true
    first-entry-only: true
    actions:
      - type: message
        value: "&2The forest is rich with herbs, tracks, and danger."
      - type: console_command
        value: "your-quest-plugin start forest_intro %player%"

# mine.yml
id: mine
display-name: "Abandoned Mine"
parent-id: starter_valley
world-name: world
world-id: world
min: {x: 80, y: 45, z: 10}
max: {x: 140, y: 95, z: 70}
events:
  enter:
    enabled: true
    override-parent: true
    first-entry-only: true
    actions:
      - type: message
        value: "&7The abandoned mine still holds ore and unanswered questions."
      - type: console_command
        value: "your-quest-plugin start mine_intro %player%"

# ruins.yml
id: ruins
display-name: "Sunken Ruins"
parent-id: starter_valley
world-name: world
world-id: world
min: {x: 30, y: 50, z: 80}
max: {x: 120, y: 100, z: 150}
events:
  enter:
    enabled: true
    override-parent: true
    first-entry-only: true
    actions:
      - type: message
        value: "&6The ruins reveal fragments of the world's older history."
      - type: console_command
        value: "your-quest-plugin start ruins_intro %player%"

# danger_canyon.yml
# This is the only hard-gated branch in the starter template.
# An external plugin can open it for a player with:
# ws progress <player> danger_canyon unlock
id: danger_canyon
display-name: "Danger Canyon"
parent-id: starter_valley
world-name: world
world-id: world
statuses: [locked]
min: {x: 120, y: 45, z: 80}
max: {x: 160, y: 110, z: 150}
events:
  enter:
    enabled: true
    override-parent: true
    first-entry-only: true
    actions:
      - type: message
        value: "&cThe canyon is finally open to you."
