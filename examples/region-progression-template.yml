# Schema 2 starter region.
# Copy it to plugins/WorldScript/regions/ and rename it.
schema: 2
id: starter_valley
identity:
  name: Starter Valley
  role: hub
  content-id: starter_hub
  parent: null
location:
  world: world
  world-id: world
  priority: 0
  min: {x: 0, y: 50, z: 0}
  max: {x: 160, y: 110, z: 160}
state:
  inherit: true
  statuses: []
variables:
  short_name: Valley
events:
  enter:
    enabled: true
    mode: first
    actions:
      - type: message
        value: "&aStarter Valley is open. Choose a direction to explore."
