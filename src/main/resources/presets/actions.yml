# WorldScript action presets. Region files may use preset + values directly.
# The preset name is intentionally stable; display text can be localized later.
actions:
  text-display:
    name: "区域标题"
    type: text-display
    defaults:
      title: "&b区域标题"
      subtitle: "&f区域副标题"
      fade-in: "20"
      stay: "100"
      fade-out: "20"
  message:
    name: "聊天消息"
    type: message
    defaults:
      text: "&7区域消息"
  sound:
    name: "播放音效"
    type: sound
    defaults:
      sound: "BLOCK_PORTAL_TRIGGER"
      volume: "1.0"
      pitch: "1.0"
  player-command:
    name: "玩家命令"
    type: player-command
    defaults:
      command: "spawn"
  console-command:
    name: "控制台命令"
    type: console-command
    defaults:
      command: "say %player% entered %region%"
  teleport:
    name: "传送玩家"
    type: teleport
    defaults:
      world: "world"
      x: "0"
      y: "80"
      z: "0"
  give-item:
    name: "给予物品"
    type: give-item
    defaults:
      material: "DIAMOND"
      amount: "1"
  give-experience:
    name: "给予经验"
    type: give-experience
    defaults:
      amount: "10"
  give-money:
    name: "给予金钱"
    type: give-money
    defaults:
      amount: "100"
  set-region-status:
    name: "设置区域状态"
    type: set-region-status
    defaults:
      region: "target_region"
      status: "open"
  set-variable:
    name: "设置玩家变量"
    type: set-variable
    defaults:
      key: "discovered"
      value: "true"
  unlock-region:
    name: "解锁区域"
    type: unlock-region
    defaults:
      region: "target_region"
  complete-region:
    name: "完成区域"
    type: complete-region
    defaults:
      region: "target_region"
