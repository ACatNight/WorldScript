config-version: 2
language: en_US
selection:
  tool: GOLD_AXE
messages:
  # Optional region transition messages.
  region-enter-enabled: false
  region-leave-enabled: false
  enter: '&aEntering region: &f%region%'
  leave: '&7Leaving region: &f%region%'
gui:
  event-icon: PAPER
placeholders:
  # Tokens: {parent}, {current}, {child}, {id}, {path}
  region-name-format: '{parent} / {current}'
editor:
  input-timeout-seconds: 120
discovery:
  enabled: false
  title:
    enabled: false
  sound:
    enabled: false
  reward:
    enabled: false
conditions:
  enabled: false
  deny:
    title:
      enabled: true
      text: '&cAccess denied'
      subtitle: '&7%reason%'
      fade-in: 5
      stay: 30
      fade-out: 5
