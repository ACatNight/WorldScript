name: WorldScript
version: ${version}
main: com.worldscript.WorldScriptPlugin
description: RPG region scripting plugin for Paper 1.12.2 to 1.21.8.
# 1.13 is the minimum Bukkit API level that understands api-version.
# Keep this at the compatibility floor; using 1.21 would unnecessarily
# opt the plugin out of older Paper servers.
api-version: '1.13'
softdepend: [PlaceholderAPI, MythicMobs]
commands:
  ws:
    description: WorldScript administration command
    usage: /ws <wand|selection|create|polygon|delete|list|settings|info|edit|reload|language|validate|progress|toast|modules|spawn|protect|test>
    permission: worldscript.admin
permissions:
  worldscript.admin:
    default: op
